<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cam360 pipeline test</title>
  <link rel="icon" href="../brand/logo-mark.svg" type="image/svg+xml" />
  <style>
    :root {
      --ink: #37352f;
      --ink-2: rgba(55, 53, 47, 0.72);
      --ink-3: rgba(55, 53, 47, 0.5);
      --canvas: #ffffff;
      --sunken: #f7f6f3;
      --line: rgba(55, 53, 47, 0.1);
      --line-2: rgba(55, 53, 47, 0.16);
      --blue: #2383e2;
      --blue-press: #1a6dc0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: rgba(255, 255, 255, 0.9);
        --ink-2: rgba(255, 255, 255, 0.66);
        --ink-3: rgba(255, 255, 255, 0.44);
        --canvas: #191919;
        --sunken: #2b2b2b;
        --line: rgba(255, 255, 255, 0.094);
        --line-2: rgba(255, 255, 255, 0.16);
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--canvas); color: var(--ink);
      padding: 40px 24px; -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 680px; margin: 0 auto; }
    .brand {
      display: flex; align-items: center; gap: 10px;
      font-size: 17px; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 6px;
    }
    .brand svg { width: 24px; height: 24px; border-radius: 6px; flex: 0 0 auto; display: block; }
    .tag { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
           color: var(--ink-3); margin-bottom: 20px; }
    p.lede { color: var(--ink-2); font-size: 15px; line-height: 1.6; margin-bottom: 22px; }
    video {
      width: 100%; aspect-ratio: 4 / 3; border-radius: 12px;
      border: 1px solid var(--line-2); background: #000; display: block;
    }
    .bar { display: flex; align-items: center; gap: 14px; margin-top: 16px; flex-wrap: wrap; }
    button {
      padding: 10px 20px; border: none; border-radius: 8px; background: var(--blue);
      color: #fff; font-weight: 500; cursor: pointer; font-size: 14px;
      font-family: inherit; min-height: 40px;
    }
    button:hover { background: var(--blue-press); }
    #status { font-size: 13px; color: var(--ink-3); min-height: 18px; }
    #status.live { color: var(--blue); }
    #status.err { color: #e03e3e; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <rect width="48" height="48" rx="11" fill="#2383E2"/>
        <circle cx="24" cy="24" r="11" fill="none" stroke="#fff" stroke-width="3.25"
                stroke-linecap="round" stroke-dasharray="57 12.1" transform="rotate(-14 24 24)"/>
        <circle cx="24" cy="24" r="4.25" fill="#fff"/>
      </svg>
      Cam360
    </div>
    <p class="tag">Pipeline test</p>
    <p class="lede">Click start to request your camera. If Cam360 is installed and enabled, the video
      below is the processed stream. Open the Cam360 popup, move the sliders or toggle Mirror, and
      watch this update live.</p>

    <video id="v" autoplay playsinline muted></video>

    <div class="bar">
      <button id="start">Start camera</button>
      <span id="status"></span>
    </div>
  </div>

  <script>
    const v = document.getElementById("v");
    const status = document.getElementById("status");
    document.getElementById("start").addEventListener("click", async () => {
      status.className = "";
      status.textContent = "Requesting camera...";
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        v.srcObject = stream;
        const t = stream.getVideoTracks()[0];
        status.className = "live";
        status.textContent = "Live. Track: " + (t ? t.label || "camera" : "none");
      } catch (e) {
        status.className = "err";
        status.textContent = "Error: " + e.message;
      }
    });
  </script>
</body>
</html>
