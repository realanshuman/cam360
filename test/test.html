<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cam360 — pipeline test</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #17122b; color: #f5f3ff;
           text-align: center; padding: 24px; }
    h1 { font-size: 20px; }
    p { color: #b9a9e6; max-width: 560px; margin: 8px auto 20px; line-height: 1.5; }
    video { width: 640px; max-width: 92vw; border-radius: 14px; border: 1px solid #a78bfa55;
            background: #000; }
    button { margin-top: 18px; padding: 10px 20px; border: none; border-radius: 10px;
             background: linear-gradient(90deg,#7c3aed,#4f46e5); color: #fff;
             font-weight: 700; cursor: pointer; font-size: 14px; }
    #status { margin-top: 12px; font-size: 13px; color: #c4b5fd; min-height: 18px; }
  </style>
</head>
<body>
  <h1>◉ Cam360 — camera pipeline test</h1>
  <p>Click start to request your camera. If Cam360 is installed and enabled, the
     video below is the <em>processed</em> stream — open the Cam360 popup and move
     the sliders / toggle Mirror and watch this update live.</p>
  <video id="v" autoplay playsinline muted></video>
  <div id="status"></div>
  <br />
  <button id="start">Start camera</button>

  <script>
    const v = document.getElementById("v");
    const status = document.getElementById("status");
    document.getElementById("start").addEventListener("click", async () => {
      status.textContent = "Requesting camera…";
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        v.srcObject = stream;
        const t = stream.getVideoTracks()[0];
        status.textContent = "Live — track: " + (t ? t.label || "camera" : "none");
      } catch (e) {
        status.textContent = "Error: " + e.message;
      }
    });
  </script>
</body>
</html>
